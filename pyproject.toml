[project]
name = "earth1-engine"
version = "0.1.0"
description = "Earth-1 civilization engine — vectorized force-field opinion dynamics at scale"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
llm = ["anthropic>=0.30", "openai>=1.0"]
db = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
sources = ["pytrends>=4.9"]
billing = ["stripe>=5.0"]
dev = ["pytest>=7.0", "httpx>=0.24"]
# REPRODUCIBILITY PIN (Benchmark A Phase 0, 2026-08-23): the pinned
# trajectory hash in tests/test_perf_equivalence.py was produced under
# exactly these versions on CPython 3.9.6 / arm64 / Apple Accelerate BLAS.
# The bit-exact assertion runs only in this environment; elsewhere it
# skips with a loud warning. `pip install -e ".[repro]"` reproduces it.
repro = ["numpy==2.0.2", "scipy==1.13.1"]

[project.scripts]
earth1-api = "earth1.api.main:run"
# review M09: pointed at earth1.benchmark, a module that does not exist.
# The harness lives in earth1.legacy_benchmark (import-gated behind
# EARTH1_LEGACY_COMPARISON=1 by design; the official benchmark path is
# earth1.benchmark_living, a library without a CLI).
earth1-benchmark = "earth1.legacy_benchmark:run_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# review M09: with no package table, setuptools flat-layout
# auto-discovery sees multiple top-level dirs (tests, ops, docs, ...)
# and refuses to build. Discover only the earth1 package tree.
[tool.setuptools.packages.find]
include = ["earth1*"]
